services:
  postgres:
    image: postgres:16-alpine
    container_name: verzel_events_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: verzel_events_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d verzel_events_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
